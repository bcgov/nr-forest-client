name: Tools environment cleanup

on:
  workflow_call:

permissions: {}

jobs:
  tools-cleanup:
    name: Cleanup tools environment
    runs-on: ubuntu-26.04
    steps:
      - name: Scale down services
        continue-on-error: true
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: d2723f-dev
          oc_token: ${{ secrets.oc_token }}
          oc_server: ${{ secrets.oc_server }}
          commands: |
            for component in legacy api; do
              dep="deployment/nr-forest-client-${{ github.event.number }}-${component}"
              if oc get "$dep" >/dev/null 2>&1; then
                echo "Scaling down $dep to 0 replicas..."
                oc scale "$dep" --replicas=0
                oc wait --for=delete pod -l "deployment=nr-forest-client-${{ github.event.number }}-${component}" --timeout=60s 2>/dev/null || true
              fi
            done

            for i in {1..30}; do
              remaining=$(oc get pods -l "app=nr-forest-client-${{ github.event.number }}" --no-headers 2>/dev/null | grep -E 'legacy|api' | wc -l)
              if [ "$remaining" -eq 0 ]; then
                echo "All legacy and api pods successfully terminated."
                break
              fi
              echo "Waiting for remaining pods to terminate ($remaining remaining)... ($i/30)"
              sleep 2
            done
            sleep 5

      - name: Remove the PR database
        continue-on-error: true
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: d2723f-tools
          oc_token: ${{ secrets.oc_token_tools }}
          oc_server: ${{ secrets.oc_server }}
          commands: |
            # This removes a new pluggable database, user and service for the PR
            for i in {1..5}; do
              POD_NAME=$(oc get pods -l app=nr-forest-client-tools -l deployment=nr-forest-client-tools-legacydb -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
              if [ -n "$POD_NAME" ]; then
                echo "Pod found: $POD_NAME"
                oc exec $POD_NAME -- /opt/oracle/removeDatabase "THE" "PR_${{ github.event.number }}"
                break
              else
                echo "Pod not found, retrying in 10 seconds... ($i/5)"
                sleep 10
              fi
            done

            if [ -z "$POD_NAME" ]; then
              echo "Failed to find the pod after 5 attempts."
            fi

      - name: Remove completed pods and jobs (cronjobs)
        run: |
          oc delete po --field-selector=status.phase==Succeeded
          oc delete jobs --field-selector status.successful=1
