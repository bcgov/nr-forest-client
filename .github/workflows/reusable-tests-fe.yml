name: Reusable Unit Tests and Analysis

on:
  workflow_call:

permissions: {}

jobs:
  tests-frontend:
    name: Frontend Unit Tests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-26.04
    steps:
      - uses: bcgov/actions/test-and-analyse@01c3fa1c94c8ccea526ce718b40d8a93bb0a2279 # v0.16.0
        env:
          VITE_BACKEND_URL: http://localhost:8080
          VITE_FRONTEND_URL: http://localhost:3000
          VITE_NODE_ENV: test
          VITE_COVERAGE: true
          VITE_PORT: 3000
          VITE_AWS_COGNITO_REGION: 'ca-central-1'
          VITE_AWS_COGNITO_POOL_ID: ${{ secrets.COGNITO_USER_POOL }}
          VITE_AWS_COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
          VITE_AWS_COGNITO_DOMAIN: ${{ secrets.COGNITO_DOMAIN }}
          VITE_AWS_COGNITO_ENVIRONMENT: dev
          VITE_LOGOUT_BCSC_URL: http://localhost:3000
          VITE_LOGOUT_BCEIDBUSINESS_URL: http://localhost:3000
          VITE_LOGOUT_IDIR_URL: http://localhost:3000
        with:
          node_version: 22.18.0
          commands: |
            npm ci
            npm run coverage
          working_directory: frontend
          sonar_args: >
            -Dsonar.sources=src
            -Dsonar.tests=tests,cypress
            -Dsonar.exclusions=**/coverage/**,**/dist/**,**/node_modules/**,**/stub/**,**/reports/**,**/.nyc_output/**
            -Dsonar.coverage.exclusions=eslint.config.mjs,vite.config.ts,cypress.config.ts,vitest.setup.ts,stub-tests.ts,components.d.ts,env.d.ts,**/assets/**,**/dto/**,**/CoreConstants.ts,**/src/CoreConstants.ts,**/main.ts,**/routes.ts,**/shims-vue.d.ts,**/styles.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info            
            -Dsonar.organization=bcgov-sonarcloud
            -Dsonar.projectKey=forest-client-frontend
          sonar_token: ${{ secrets.SONAR_TOKEN_FRONTEND }}
          triggers: |
            frontend/

      - uses: actions/upload-artifact@v7
        name: Upload Cypress Screenshots with error
        continue-on-error: true
        if: failure()
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          retention-days: 7
