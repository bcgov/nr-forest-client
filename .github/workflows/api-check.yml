name: API Validation Check

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify-api:
    name: Verify Gateway (${{ matrix.environment }})
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      matrix:
        environment: [test, prod]
    env:
      GTW_DOMAIN: api.gov.bc.ca
    steps:
      - uses: actions/checkout@v7

      - name: Postman Smoke Test on API Gateway
        uses: matt-ball/newman-action@b46f18d42cbdce32cb4e426fe9b3ce98a75f957f # v0.3.7
        with:
          collection: api/postman/FCA.postman_collection.json
          envVar: '[{"key":"URL_FCA","value":"https://nr-forest-client-api-${{ matrix.environment }}.${{ env.GTW_DOMAIN }}"}]'
          reporters: '["cli"]'
          folder: '["general"]'
