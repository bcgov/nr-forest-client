name: Reporting

on:
  schedule: [cron: "0 11 * * 6"] # 3 AM PST = 12 PM UDT, Saturdays
  workflow_dispatch:
  workflow_call: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # https://github.com/bcgov/actions-openshift
  schema-spy:
    name: SchemaSpy Documentation
    permissions:
      contents: write
      pages: write
    uses: bcgov/actions-openshift/.github/workflows/.schema-spy.yml@b2757e12d08b7d3bf2c5df7cd58b4cdaf6b3ea71 # v0.11.1
    with:
      flyway_locations: 'filesystem:./backend/src/main/resources/db/migration'
      flyway_schema: 'nrfc'
      schemaspy_schema: 'nrfc'
    
  zap_scan:
    runs-on: ubuntu-26.04
    name: Penetration Tests
    env:
      DOMAIN: apps.silver.devops.gov.bc.ca
      PREFIX: ${{ github.event.repository.name }}-test
    permissions:
      issues: write
    steps:
      - name: ZAP Scan
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          allow_issue_writing: true
          artifact_name: "zap_frontend"
          cmd_options: "-a"
          issue_title: "ZAP: frontend"
          target: https://forestclient-test.apps.silver.devops.gov.bc.ca

  zap_scan_api:
    runs-on: ubuntu-26.04
    name: API Penetration Tests
    permissions:
      issues: write
    steps:
      - name: ZAP Scan
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          allow_issue_writing: true
          artifact_name: "zap_api"
          cmd_options: "-a"
          issue_title: "ZAP: API"
          target: https://nr-forest-client-api-test-backend.apps.silver.devops.gov.bc.ca

