name: PR Validate

on:
  pull_request:
    types: [edited, opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-edit-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vars:
    name: Variables
    runs-on: ubuntu-26.04
    outputs:
      url: ${{ steps.calculate.outputs.url }}
    steps:
      - name: Calculate the deployment number
        id: calculate
        run: echo "url=$((${{ github.event.number }} % 50))" >> $GITHUB_OUTPUT

  validate:
    name: Validate PR
    needs: [vars]
    permissions:
      pull-requests: write
    runs-on: ubuntu-26.04
    steps:
      - uses: bcgov/actions/pr-validate@acc058abf85bb183dad21b839a92a40a4ff47af3 # v0.14.0
        with:
          markdown: |
            ---

            Thanks for the PR!

            Deployments, as required, will be available below:
            Any successful deployments (not always required) will be available [here](https://${{ github.event.repository.name }}-${{ needs.vars.outputs.url }}-frontend.apps.silver.devops.gov.bc.ca/)

            Please create PRs in draft mode.  Mark as ready to enable:
            - [Analysis Workflow](https://github.com/${{ github.repository }}/actions/workflows/analysis.yml)

            After merge, new images are deployed in:
            - [Merge Workflow](https://github.com/${{ github.repository }}/actions/workflows/merge.yml)

  # ==========================================================================
  # WARNING: This job acts as the required merge gate for this workflow.
  # If you add a new job to this workflow, you MUST add its ID to the 'needs'
  # array below, otherwise its failure or cancellation will not block the PR!
  # ==========================================================================
  results:
    name: Validate Results
    needs: [validate]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - uses: bcgov/actions/workflow-results@acc058abf85bb183dad21b839a92a40a4ff47af3 # v0.14.0
        with:
          needs: ${{ toJson(needs) }}
